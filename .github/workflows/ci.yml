name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (warnings as errors, NuGet audit)
        run: dotnet build Musicals.slnx

      - name: Vulnerable packages
        run: |
          dotnet list Musicals.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Architecture tests
        run: dotnet test tests/Musicals.ArchitectureTests --no-build

      - name: Acceptance tests (Testcontainers)
        run: dotnet test tests/Musicals.AcceptanceTests --no-build

      - name: Harness tests
        run: bash plugins/dotnet-team/tests/run.sh
